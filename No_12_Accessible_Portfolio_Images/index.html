<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No. 12 - Meaningful Alt Text for Portfolio Images</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<h1>No. 12 — My Portfolio Images</h1>
<figure><img src="https://placehold.co/300x180" alt="A placeholder landscape used in my portfolio" width="300"><figcaption>Sample project image</figcaption></figure>
<figure><img src="https://placehold.co/300x180?text=Project" alt="Preview of a sample website project" width="300"><figcaption>Website project</figcaption></figure>
<p>Write useful alt text that describes the image's purpose. Do not use alt text such as “image1”.</p>
</main>
</body>
</html>
