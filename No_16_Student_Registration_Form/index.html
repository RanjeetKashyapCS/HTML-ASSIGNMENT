<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No. 16 - Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<h1>No. 16 — Student Registration Form</h1>
<form>
<label for="name">Full Name:</label><br><input id="name" name="name" type="text" required><br><br>
<label for="email">Email:</label><br><input id="email" name="email" type="email" required><br><br>
<label for="dob">Date of Birth:</label><br><input id="dob" name="dob" type="date"><br><br>
<label for="course">Course:</label><br><select id="course" name="course"><option>BCA AI</option><option>BCA</option><option>BSc</option></select><br><br>
<label><input type="checkbox" required> I confirm the details are correct.</label><br><br>
<button type="submit">Register</button>
</form>
</main>
</body>
</html>
