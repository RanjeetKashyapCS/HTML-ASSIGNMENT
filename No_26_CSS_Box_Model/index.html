<div class="sample">This is the content area.</div>
<ul><li><strong>Content:</strong> The text or image inside.</li><li><strong>Padding:</strong> Space between content and border.</li><li><strong>Border:</strong> The line around the padding.</li><li><strong>Margin:</strong> Space outside the border.</li></ul>
