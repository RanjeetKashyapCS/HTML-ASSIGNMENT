<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No. 19 - Add Missing Meta Tags</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<h1>No. 19 — Meta Tags Checklist</h1>
<p>Use these tags inside the <code>&lt;head&gt;</code> of each HTML page:</p>
<pre><code>&lt;meta charset="UTF-8"&gt;
&lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
&lt;meta name="description" content="A short description of this page"&gt;
&lt;title&gt;My Page Title&lt;/title&gt;</code></pre>
</main>
</body>
</html>
